[interpretation]
raw_energy = "Includes whistle, background, recorder response and noise; never used alone to choose bandwidth."
positive_excess_energy = "Positive power above the within-clip 20th-percentile spectrum; it still includes stochastic broadband noise and is not treated as whistle energy."
tonal_component = "Best continuous narrow-band component is measured separately in 2-40, 40-96 and 96-136 kHz locally whitened spectrograms. The 2 kHz floor avoids low-frequency flow/engine-edge artefacts but may miss rare very-low whistles; all components are bandwidth/quality proxies rather than validated contours."
quality_flags = "Descriptive audit flags only; exclusion policy is frozen only after reviewing the full distributions."
