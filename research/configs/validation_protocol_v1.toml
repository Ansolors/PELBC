[protocol]
protocol_id = "campaign_grouped_nested_validation_v1"
frozen_on = "2026-08-28"
source_dataset_version = "0.3.0"
output_dataset_version = "0.4.0"
independent_metric_unit = "encounter"
label_scope = "encounter_bag"
primary_cohort = "primary_234"
primary_labels = ["Feeding", "Travelling", "Milling", "Socializing"]
primary_metric = "encounter_level_macro_average_precision"
same_assignments_for_every_model = true

[grouping]
group_unit = "recording_campaign_block"
date_source = "audio_date"
campaign_definition = "maximal within-year chain of observed audio dates separated by no more than one calendar day"
maximum_gap_days = 1
derive_campaigns_from_all_258_audio_encounters = true
group_same_date_across_locations = true
cross_year_campaigns_prohibited = true
reason = "guard against leakage from same-day or consecutive-day recording conditions, groups and equipment settings"

[location_normalization]
method = "strip_whitespace_and_unicode_casefold_only"
prohibit_fuzzy_merging = true
note = "Case variants are merged; spelling transpositions are not changed without source evidence."

[outer_cv]
fold_count = 5
split_seed = 20260828
algorithm = "deterministic_balanced_group_swap_v1"
search_restarts = 64
iterations_per_restart = 8000
campaigns_per_fold = 10
test_role = "outer_test"
train_role = "outer_train"
outer_test_used_for_selection = false

[inner_cv]
fold_count = 4
seed_offset = 1000
seed_rule = "outer split seed + seed_offset + one-based outer fold index"
algorithm = "deterministic_balanced_group_swap_v1"
search_restarts = 48
iterations_per_restart = 5000
campaigns_per_validation_fold = 10
purpose = "hyperparameter selection, early-stopping epoch estimation, calibration and decision-threshold selection within outer training data only"

[balance_features]
encounter_count_weight = 8.0
positive_label_count_weight = 10.0
multilabel_encounter_count_weight = 3.0
year_count_weight = 2.0
sample_rate_count_weight = 1.0
major_location_count_weight = 1.0
bag_size_bin_count_weight = 2.0
total_main_whistle_count_weight = 1.0
major_location_minimum_encounters = 10
bag_size_bins = ["1-2", "3-5", "6-19", "20+"]
acoustic_feature_values_used_for_stratification = false

[split_acceptance]
outer_minimum_test_encounters = 40
outer_maximum_test_encounters = 55
outer_minimum_positive_per_label = 8
outer_minimum_negative_per_label = 8
outer_maximum_absolute_label_prevalence_deviation = 0.10
inner_minimum_validation_encounters = 30
inner_maximum_validation_encounters = 60
inner_minimum_positive_per_label = 5
inner_minimum_negative_per_label = 5
require_every_encounter_exactly_one_outer_test = true
require_campaign_disjointness = true
require_inner_subset_of_outer_train = true

[model_selection]
selection_metric = "mean_inner_validation_macro_average_precision"
selection_seed = 20260829
neural_candidate_budget_per_outer_fold = 12
classical_candidate_budget_per_outer_fold = 24
cnn_selection_model = "hf_lw_gam"
pooling_ablation_reuses_selected_main_configuration = true
pooling_ablation_independent_reoptimization = false
pooling_ablation_reason = "isolate pooling-head effects while holding the encoder and training configuration fixed"
adaptive_test_set_tuning_prohibited = true
tie_tolerance_macro_ap = 0.001
tie_break_order = ["fewer_trainable_parameters", "lower_validation_latency", "lexicographic_configuration_id"]

[neural_training]
maximum_epochs = 100
early_stopping_patience = 12
early_stopping_minimum_delta = 0.0001
tuning_repetitions_per_candidate = 1
final_outer_training_seeds = [20260828, 20260829, 20260830]
final_epoch_rule = "rounded median inner-fold best epoch for selected configuration, then train on all outer-training encounters"
outer_prediction_rule = "arithmetic mean of three final-seed probabilities"
record_determinism_flags = true

[normalization_and_imbalance]
fit_scope = "outer or inner training partition only as appropriate"
per_mel_standardization = "training partition statistics only"
positive_class_weights = "computed from current training partition only"
feature_selection = "training partition only"
prohibit_global_pre_split_statistics = true

[calibration]
status = "secondary_prespecified_analysis"
method = "per_label_platt_logistic"
fit_data = "inner out-of-fold predictions from outer-training encounters only"
probability_clip = [0.000001, 0.999999]
l2_inverse_regularization_c = 1.0
apply_to_outer_test_after_fit = true
constant_prior_baseline_recalibration = false
report_raw_and_calibrated_brier = true

[decision_thresholds]
threshold_free_primary_metric = true
fixed_threshold = 0.5
optimized_threshold_metric = "per_label_f1"
optimized_threshold_fit_data = "calibrated inner out-of-fold predictions only"
tie_rule = "largest threshold among equal maximum F1 values"
report_fixed_and_inner_optimized_f1 = true
test_label_threshold_selection_prohibited = true

[metrics]
primary = "macro_average_precision"
secondary_threshold_free = ["per_label_average_precision", "macro_roc_auc", "per_label_roc_auc"]
secondary_thresholded = ["macro_f1", "per_label_f1", "hamming_loss"]
calibration = ["macro_brier_score", "per_label_brier_score", "adaptive_ece_10_bins"]
efficiency = ["trainable_parameter_count", "peak_memory_mb", "wall_clock_training_seconds", "median_encounter_inference_ms"]
roc_auc_minimum_positive = 3
roc_auc_minimum_negative = 3
undefined_metric_policy = "report NA with denominator and reason; never silently omit"

[uncertainty]
method = "recording_campaign_cluster_percentile_bootstrap"
resamples = 10000
confidence_level = 0.95
seed = 20260831
resample_unit = "recording_campaign_block"
metric_weighting = "encounter weighted after sampling complete campaign blocks with replacement"
invalid_replicate_policy = "redraw if any required label lacks a positive or negative encounter"

[paired_tests]
method = "campaign_cluster_paired_prediction_swap_permutation"
permutations = 10000
seed = 20260832
alternative = "two_sided"
alpha = 0.05
p_value_rule = "(1 + count(abs(permuted_delta) >= abs(observed_delta))) / (permutations + 1)"
multiple_testing = "Holm correction across four confirmatory macro-AP contrasts"
fold_level_independent_tests_prohibited = true

[[confirmatory_contrasts]]
contrast_id = "H1a_hf_lw_gam_vs_prior"
model_a = "hf_lw_gam"
model_b = "prior_constant"
metric = "macro_average_precision"

[[confirmatory_contrasts]]
contrast_id = "H1b_hf_lw_gam_vs_bag_size"
model_a = "hf_lw_gam"
model_b = "bag_size_logistic"
metric = "macro_average_precision"

[[confirmatory_contrasts]]
contrast_id = "H2_hf_lw_gam_vs_cnn_mean"
model_a = "hf_lw_gam"
model_b = "cnn_mean"
metric = "macro_average_precision"

[[confirmatory_contrasts]]
contrast_id = "H3_hf_lw_gam_vs_handcrafted"
model_a = "hf_lw_gam"
model_b = "handcrafted_logistic"
metric = "macro_average_precision"

[temporal_stress]
leave_one_year_out_years = [2021, 2022, 2023, 2024, 2025]
leave_one_year_out_scope = "HF-LW-GAM and all mandatory nonconditional comparators"
forward_scenario_id = "forward_train_2021_2023_validate_2024_test_2025"
forward_train_years = [2021, 2022, 2023]
forward_validation_years = [2024]
forward_test_years = [2025]
forward_scope = "HF-LW-GAM, prior, bag-size, metadata, handcrafted, CNN-mean, PANNs and AVES"
test_year_information_for_tuning_prohibited = true

[location_stress]
canonical_location_minimum_encounters = 10
minimum_positive_per_label = 3
minimum_negative_per_label = 3
buffer_same_campaign_non_target_encounters = true
scope = "HF-LW-GAM, bag-size, metadata, handcrafted and strongest acoustic comparator declared before inspecting location-test results"

[sample_rate_stress]
scenario_id = "train_288khz_test_384_or_576khz"
train_native_sample_rates_hz = [288000]
test_native_sample_rates_hz = [384000, 576000]
buffer_same_campaign_train_encounters = true
scope = "HF-LW-GAM and mandatory nuisance/acoustic baselines"
interpretation_guard = "sample rate and year are confounded, so this cannot isolate a causal recorder effect"

[stress_model_selection]
default_inner_fold_count = 4
method = "deterministic campaign-grouped inner CV within each scenario train_pool only"
seed_base = 20261828
search_restarts = 32
iterations_per_restart = 3500
minimum_validation_positive_per_label = 3
minimum_validation_negative_per_label = 3
archive_every_assignment = true
forward_scenario_exception = "use the fixed 2024 validation set for selection, epoch estimation, calibration and thresholds; never use 2025 labels"

[bandwidth_sensitivity]
main_preprocessing_id = "whistle_logmel_96k_v1"
sensitivity_sample_rate_hz = 192000
sensitivity_frequency_range_hz = [500, 90000]
outer_assignments = "identical to primary five-fold assignments"
scope = "HF-LW-GAM paired representation comparison"

[cohort_sensitivity]
cohorts = ["numeric_behavior_236", "scans_ge_2_218", "behavior_sum_equal_scans_121", "all_segments_4152", "high_confidence_3884"]
split_rule = "reuse primary campaign-to-fold assignment; additional numeric-cohort encounters inherit their campaign fold"
reoptimization_prohibited = true

[prefix_evaluation]
budgets = [1, 3, 5, 10, 20]
include_full_bag = true
order_field = "sequence_index"
order_interpretation = "chronological order verified by exact concatenation offsets in the parent encounter WAV"
all_encounter_curve = "use first min(k, available main instances) and retain all 234 encounters"
fixed_k_subset = "secondary analysis restricted to encounters with at least k main instances"
random_subset_primary_prohibited = true
scope = "offline detected-whistle evidence accumulation, not validated at-sea latency"

[reporting]
save_one_out_of_fold_prediction_per_encounter_per_model = true
save_seed_level_predictions = true
save_inner_trial_history = true
save_selected_hyperparameters_and_epochs = true
save_calibration_coefficients_and_thresholds = true
save_fold_level_metrics_for_diagnostics_only = true
primary_table_uses_pooled_encounter_out_of_fold_predictions = true
report_prevalence_and_denominator_for_every_metric = true
claims_remain_encounter_level = true
attention_is_not_instance_ground_truth = true
