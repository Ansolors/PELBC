[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dolphin-whistle-behavior-mil"
version = "0.1.0"
description = "Leakage-aware benchmark of established and task-adapted models for encounter-level dolphin whistle behavior-context prediction"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "tomli>=2,<3; python_version < '3.11'",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "soundfile>=0.12,<1",
  "librosa>=0.10,<1",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<1",
  "pyarrow>=14,<30",
]

[project.optional-dependencies]
train = [
  "torch>=2.1,<3",
  "torchaudio>=2.1,<3",
  "timm>=0.9,<2",
]
test = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
